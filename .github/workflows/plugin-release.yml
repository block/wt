name: Plugin Release

on:
  push:
    tags:
      - 'plugin-v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6
        with:
          distribution: temurin
          java-version: 17

      - name: Build plugin
        working-directory: wt-jetbrains-plugin
        run: ./gradlew buildPlugin --no-build-cache

      - name: Test
        working-directory: wt-jetbrains-plugin
        run: ./gradlew test --no-build-cache

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          files: wt-jetbrains-plugin/build/distributions/*.zip
          generate_release_notes: true
